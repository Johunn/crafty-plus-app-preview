name: Build CRAFTY+ Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Build the existing app for Android WebView
        run: npm run build:android:web
      - name: Package the app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: crafty-plus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
