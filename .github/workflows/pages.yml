name: Build and deploy CRAFTY+ preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "messages/**"
      - "package.json"
      - "package-lock.json"
      - "project.inlang/**"
      - "public/**"
      - "src/**"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and build the PWA
        run: npm run build

      - name: Add the single-page app fallback
        run: cp dist/index.html dist/404.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
